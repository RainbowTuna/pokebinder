name: Update card catalog

on:
  schedule:
    - cron: '17 6 * * *' # every day; new sets show up the day after TCGplayer lists them
  workflow_dispatch: # "Run workflow" button on GitHub

permissions:
  contents: write

concurrency: catalog

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build catalog
        # Prices change every day; refresh them weekly (and on manual runs) to keep the repo small.
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python tools/build_catalog.py --prices
          else
            python tools/build_catalog.py
          fi
      - name: Save if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update card catalog ($(date -u +%F))"
          git push
