<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15151b" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PokéBinder">
  <title>PokéBinder</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css?v=19">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js" defer></script>
  <!-- On every release: add an entry to changelog.js and bump ?v= here and in app.js's imports, so phones never mix old and new files. -->
  <script type="module" src="app.js?v=19"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1><span class="ball" aria-hidden="true"></span>PokéBinder</h1>
      <button id="whats-new" class="version-btn" aria-label="What's new"></button>
    </div>
    <button id="account" class="account-btn">Sign in</button>
  </header>

  <main>
    <!-- ADD CARDS -->
    <section id="tab-add" class="tab active">
      <form id="search-form" class="searchbar" role="search">
        <svg class="sb-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="q-name" placeholder="Search cards" autocomplete="off" enterkeyhint="search" aria-label="Card name">
        <input id="q-number" class="sb-number" placeholder="No." autocomplete="off" enterkeyhint="search" aria-label="Card number">
        <button type="submit" class="sr-only">Find</button>
        <button type="button" id="scan-btn" class="sb-scan" aria-label="Scan a card" title="Scan a card">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6H8l1.5-2h5L16 6h1.5A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.5"/></svg>
        </button>
      </form>

      <div class="chip-row">
        <label class="chip select-chip" title="Binder new cards go into">
          <span aria-hidden="true">📒</span><select id="target" aria-label="Adding to"></select>
        </label>
        <div class="lang-toggle" role="group" aria-label="Card language">
          <button class="chip" data-lang="en">EN</button>
          <button class="chip" data-lang="ja">JP</button>
        </div>
        <label class="chip ghost" for="photo">Photo</label>
        <input id="photo" type="file" accept="image/*" hidden>
      </div>

      <div class="preview-wrap scan-row" hidden>
        <img id="preview" alt="Scanned card">
        <div id="scan-status" class="status" aria-live="polite"></div>
      </div>

      <div id="results-head" class="results-head"></div>
      <div id="results" class="grid"></div>
      <p class="add-empty">Search by name or number,<br>or tap the camera to scan a card.</p>
    </section>

    <!-- BINDERS -->
    <section id="tab-binders" class="tab">
      <div class="tabs-row">
        <div class="text-tabs" id="binder-seg">
          <button class="seg active" data-view="shelf">Binders</button>
          <button class="seg" data-view="lists">Checklists</button>
        </div>
        <details class="more" id="more-menu">
          <summary aria-label="More options">⋯</summary>
          <div class="menu">
            <button id="export">Export backup</button>
            <label for="import">Import backup</label>
          </div>
        </details>
        <input id="import" type="file" accept="application/json,.json" hidden>
      </div>

      <div id="view-shelf" class="view">
        <div id="shelf" class="shelf"></div>
      </div>

      <div id="view-binder" class="view" hidden></div>

      <div id="view-lists" class="view" hidden>
        <div id="lists" class="lists"></div>
      </div>

      <div id="view-list" class="view" hidden></div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tabbtn active" data-tab="add">➕<span>Add cards</span></button>
    <button class="tabbtn" data-tab="binders">📒<span>Binders</span></button>
  </nav>

  <div id="camera" class="camera" hidden>
    <video id="cam-video" playsinline muted autoplay></video>
    <div class="cam-frame" id="cam-frame">
      <span class="cam-tip">Fit the card inside the frame</span>
      <span class="cam-corner" id="cam-corner">↑ number is here</span>
    </div>
    <div class="cam-bar">
      <button class="cam-side" id="cam-close" aria-label="Close camera">✕</button>
      <button class="cam-shutter" id="cam-shoot" aria-label="Take photo"></button>
      <button class="cam-side" id="cam-torch" aria-label="Flashlight" hidden>🔦</button>
    </div>
  </div>

  <dialog id="modal">
    <button class="close" id="modal-close" aria-label="Close">✕</button>
    <div id="modal-body"></div>
  </dialog>
</body>
</html>
